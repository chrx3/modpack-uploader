<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChrisCraft · Panel de servidores</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0f12;
      --surface: #18181b;
      --surface-2: #0f1014;
      --border: #27272a;
      --border-hover: #3f3f46;
      --text: #e5e7eb;
      --text-dim: #9ca3af;
      --text-faint: #6b7280;
      --accent: #a7f3d0;
      --accent-2: #10b981;
      --warn: #fbbf24;
      --err: #fca5a5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px; border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 22px; font-weight: 700; color: var(--accent);
      display: flex; align-items: center; gap: 10px;
    }
    header .sub { color: var(--text-dim); margin-top: 4px; font-size: 13px; }
    header a { color: var(--text-dim); text-decoration: none; font-size: 14px; }
    header a:hover { color: var(--accent); }

    main { flex: 1; padding: 24px 28px; max-width: 900px; width: 100%; margin: 0 auto; }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 20px;
    }
    .card h2 {
      font-size: 13px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-faint); margin-bottom: 14px;
    }

    /* Estado */
    .live { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .dot.on { background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); }
    .dot.off { background: var(--text-faint); }
    .dot.busy { background: var(--warn); animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }
    .live .name { font-size: 20px; font-weight: 700; }
    .live .meta { color: var(--text-dim); font-size: 13px; }
    .motd {
      margin-top: 12px; padding: 10px 12px; background: var(--surface-2);
      border-radius: 8px; font-family: ui-monospace, Menlo, monospace;
      font-size: 12px; color: var(--text-dim); word-break: break-all;
    }

    /* Perfiles */
    .row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px; border: 1px solid var(--border);
      border-radius: 10px; margin-bottom: 10px; background: var(--surface-2);
      transition: border-color 0.15s;
    }
    .row:hover { border-color: var(--border-hover); }
    .row.active { border-color: var(--accent-2); }
    .row .info { flex: 1; min-width: 0; }
    .row .title { font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .row .desc { color: var(--text-faint); font-size: 12px; margin-top: 3px; }
    .tag {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: #1f2937; color: var(--text-dim); font-weight: 600;
    }
    .tag.live { background: #064e3b; color: var(--accent); }

    button, .btn {
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 9px 16px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border-hover); background: transparent;
      color: var(--text); transition: background 0.15s, opacity 0.15s;
    }
    button:hover:not(:disabled) { background: #27272a; }
    button.primary { background: var(--accent-2); color: #052e16; border-color: transparent; }
    button.primary:hover:not(:disabled) { background: #34d399; }
    button.danger { color: var(--err); border-color: #7f1d1d; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ===== Ajustes por perfil ===== */
    .settings {
      border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 10px 10px; padding: 18px;
      background: var(--surface-2); margin: -10px 0 10px;
    }
    .settings h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-faint); margin: 18px 0 10px; font-weight: 600;
    }
    .settings h3:first-child { margin-top: 0; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 12px; color: var(--text-dim); }
    .field .hint { font-size: 11px; color: var(--text-faint); }
    .field input[type=text], .field input[type=number], .field select {
      padding: 8px 10px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      font-size: 13px; font-family: inherit; width: 100%;
    }
    .field input:focus, .field select:focus {
      outline: none; border-color: var(--accent-2);
    }
    .field.check { flex-direction: row; align-items: center; gap: 8px; }
    .field.check input { width: 16px; height: 16px; accent-color: var(--accent-2); }
    .field.check label { font-size: 13px; color: var(--text); }
    .field.wide { grid-column: 1 / -1; }

    .extra-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .extra-row input { flex: 1; }
    .extra-row input.k { max-width: 200px; text-transform: uppercase; }
    .extra-row button { padding: 6px 10px; }

    .settings-foot {
      display: flex; gap: 10px; align-items: center;
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .settings-foot .note { font-size: 12px; color: var(--text-faint); }
    .icon-btn { padding: 8px 12px; }

    .msg { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    .msg.err { background: #2a1215; color: var(--err); border: 1px solid #7f1d1d; }
    .msg.info { background: #0f2a20; color: var(--accent); border: 1px solid #065f46; }
    .hidden { display: none !important; }
    .footer {
      padding: 16px 28px; border-top: 1px solid var(--border);
      color: var(--text-faint); font-size: 12px; text-align: center;
    }
    .footer a { color: var(--text-dim); text-decoration: none; }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🎛️ Panel de servidores</h1>
      <div class="sub">Un servidor activo a la vez en <strong>minecraft.chrsx3.com</strong></div>
    </div>
    <a href="/">← Modpacks</a>
  </header>

  <main>
    <div id="panel">
      <div id="msg" class="msg hidden"></div>

      <div class="card">
        <h2>Estado actual</h2>
        <div class="live">
          <div class="dot off" id="dot"></div>
          <div>
            <div class="name" id="activeName">—</div>
            <div class="meta" id="activeMeta"></div>
          </div>
        </div>
        <div class="motd hidden" id="motd"></div>
      </div>

      <div class="card">
        <h2>Servidores disponibles</h2>
        <div id="profiles"></div>
      </div>

      <div class="card">
        <h2>Acciones</h2>
        <div class="actions">
          <button class="primary" id="btnMain" onclick="doAction('main')">
            🏠 Volver a ChrisCraft
          </button>
          <button class="danger" id="btnStop" onclick="doAction('stop')">
            ⏹ Apagar todo
          </button>
          <button onclick="refresh()">↻ Actualizar</button>
        </div>
        <p style="color:var(--text-faint);font-size:12px;margin-top:14px">
          Crear y borrar perfiles se hace por consola con <code>mcswitch new</code> /
          <code>mcswitch rm</code>. El cambio se niega si hay gente conectada.
        </p>
      </div>
    </div>
  </main>

  <div class="footer">
    <a href="https://minecraft.chrsx3.com" target="_blank">🎮 Server</a> ·
    <a href="https://discord.gg/chrsx3" target="_blank">💬 Discord</a> ·
    <a href="/">📦 Modpacks</a>
  </div>

  <script>
    // El servidor lo inyecta al servir la pagina, despues de validar el
    // Basic Auth. Nadie tiene que escribirlo.
    const token = '__PANEL_TOKEN__';
    let timer = null;
    let busy = false;
    // Perfiles con el formulario de ajustes desplegado, y el ultimo estado
    // recibido, para poder repintar sin ir al servidor.
    const OPEN = new Set();
    let LAST = null;

    function api(path, opts = {}) {
      return fetch(path, {
        ...opts,
        headers: { 'X-Panel-Token': token, 'Content-Type': 'application/json',
                   ...(opts.headers || {}) },
      });
    }

    function showMsg(text, kind = 'info') {
      const el = document.getElementById('msg');
      if (!text) { el.classList.add('hidden'); return; }
      el.textContent = text;
      el.className = 'msg ' + kind;
    }

    function render(d) {
      LAST = d;
      busy = !!(d.job && d.job.running);

      const dot = document.getElementById('dot');
      const name = document.getElementById('activeName');
      const meta = document.getElementById('activeMeta');
      const motd = document.getElementById('motd');

      const activeProfile = (d.profiles || []).find(p => p.name === d.active);

      if (busy) {
        dot.className = 'dot busy';
        name.textContent = 'Cambiando de servidor…';
        meta.textContent = d.job.op === 'main'
          ? 'levantando ChrisCraft'
          : (d.job.op === 'stop' ? 'apagando' : 'levantando ' + (d.job.profile || ''));
        motd.classList.add('hidden');
      } else if (d.active && d.live && d.live.reachable) {
        dot.className = 'dot on';
        name.textContent = activeProfile ? activeProfile.label : d.active;
        meta.textContent = `Minecraft ${d.live.version} · ${d.live.online}/${d.live.max} jugadores`;
        if (d.live.motd) { motd.textContent = d.live.motd; motd.classList.remove('hidden'); }
        else motd.classList.add('hidden');
      } else if (d.active) {
        dot.className = 'dot busy';
        name.textContent = activeProfile ? activeProfile.label : d.active;
        meta.textContent = 'arrancando…';
        motd.classList.add('hidden');
      } else {
        dot.className = 'dot off';
        name.textContent = 'Ningún servidor activo';
        meta.textContent = '';
        motd.classList.add('hidden');
      }

      const box = document.getElementById('profiles');
      box.innerHTML = '';
      for (const p of d.profiles || []) {
        const isActive = p.name === d.active;
        const row = document.createElement('div');
        row.className = 'row' + (isActive ? ' active' : '');
        const desc = p.modpack
          ? 'modpack: ' + p.modpack.split('/').pop()
          : 'mundo propio';
        row.innerHTML = `
          <div class="info">
            <div class="title">
              ${escapeHtml(p.label)}
              ${isActive ? '<span class="tag live">activo</span>' : ''}
            </div>
            <div class="desc">${escapeHtml(p.version)} · ${escapeHtml(p.type)} · ${escapeHtml(desc)}</div>
          </div>`;
        if (!p.builtin) {
          const gear = document.createElement('button');
          gear.className = 'icon-btn';
          gear.textContent = OPEN.has(p.name) ? '⚙ Cerrar' : '⚙ Ajustes';
          gear.onclick = () => {
            OPEN.has(p.name) ? OPEN.delete(p.name) : OPEN.add(p.name);
            render(LAST);
          };
          row.appendChild(gear);
        }
        const btn = document.createElement('button');
        btn.textContent = isActive ? 'En uso' : 'Activar';
        btn.disabled = isActive || busy;
        if (!isActive) btn.onclick = () => doAction('use', p.name);
        row.appendChild(btn);
        box.appendChild(row);

        if (!p.builtin && OPEN.has(p.name)) {
          box.appendChild(buildSettings(p, isActive));
        }
      }

      document.getElementById('btnMain').disabled = busy || d.active === 'main';
      document.getElementById('btnStop').disabled = busy || !d.active;

      if (d.job && !d.job.running && d.job.op && d.job.ok === false) {
        showMsg('La última operación falló: ' + (d.job.message || ''), 'err');
      }
    }

    // Campos que se muestran como formulario. Cualquier otra clave del perfil
    // aparece abajo, en "otros ajustes", y se puede añadir a mano: el servidor
    // pasa todas las claves al contenedor, asi que sirve cualquier variable
    // que acepte la imagen itzg/minecraft-server.
    const SCHEMA = [
      { group: 'Servidor', fields: [
        { k: 'VERSION', label: 'Versión de Minecraft', hint: 'p.ej. 1.21.5 o LATEST' },
        { k: 'TYPE', label: 'Loader', type: 'select',
          options: ['VANILLA', 'NEOFORGE', 'FABRIC', 'FORGE', 'PAPER', 'QUILT'] },
        { k: 'MEMORY', label: 'RAM', hint: 'p.ej. 4G' },
        { k: 'MOTD', label: 'Nombre visible', wide: true },
        { k: 'MODPACK', label: 'Modpack (.mrpack)', type: 'modpack', wide: true,
          hint: 'elige uno de los publicados o pega otra URL; al activar el ' +
                'perfil se instala solo con su versión, su loader y sus mods' },
      ]},
      { group: 'Mundo', fields: [
        { k: 'SEED', label: 'Semilla' },
        { k: 'LEVEL', label: 'Carpeta del mundo', hint: 'por defecto: world' },
        { k: 'MODE', label: 'Modo de juego', type: 'select',
          options: ['survival', 'creative', 'adventure', 'spectator'] },
        { k: 'DIFFICULTY', label: 'Dificultad', type: 'select',
          options: ['peaceful', 'easy', 'normal', 'hard'] },
        { k: 'HARDCORE', label: 'Hardcore', type: 'bool' },
        { k: 'ALLOW_NETHER', label: 'Permitir Nether', type: 'bool' },
      ]},
      { group: 'Jugadores', fields: [
        { k: 'MAX_PLAYERS', label: 'Máximo de jugadores', type: 'number' },
        { k: 'VIEW_DISTANCE', label: 'Distancia de vista', type: 'number' },
        { k: 'OPS', label: 'Operadores', hint: 'separados por coma' },
        { k: 'WHITELIST', label: 'Whitelist', hint: 'separados por coma' },
        { k: 'ENFORCE_WHITELIST', label: 'Aplicar whitelist', type: 'bool' },
        { k: 'ONLINE_MODE', label: 'Validar cuentas de Mojang', type: 'bool' },
      ]},
      { group: 'Juego', fields: [
        { k: 'PVP', label: 'PVP', type: 'bool' },
        { k: 'ALLOW_FLIGHT', label: 'Permitir volar', type: 'bool' },
        { k: 'ENABLE_COMMAND_BLOCK', label: 'Bloques de comandos', type: 'bool' },
        { k: 'SPAWN_PROTECTION', label: 'Protección del spawn', type: 'number' },
      ]},
    ];
    const KNOWN = new Set(SCHEMA.flatMap(g => g.fields.map(f => f.k)));

    // Modpacks ya publicados en esta misma página, para elegirlos sin copiar URLs
    const PACK_BASE = location.origin + '/files/';
    let MODPACKS = [];
    async function loadModpacks() {
      try {
        const r = await fetch('/api/status');
        const d = await r.json();
        // más recientes arriba: los nombres son versiones
        MODPACKS = (d.files_ready || []).slice().sort().reverse();
      } catch (e) {
        MODPACKS = [];
      }
    }

    function buildSettings(p, isActive) {
      const cfg = p.config || {};
      const box = document.createElement('div');
      box.className = 'settings';
      box.dataset.profile = p.name;

      for (const g of SCHEMA) {
        const h = document.createElement('h3');
        h.textContent = g.group;
        box.appendChild(h);
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const f of g.fields) {
          grid.appendChild(buildField(f, cfg[f.k] ?? ''));
        }
        box.appendChild(grid);
      }

      // Claves del perfil que no están en el formulario
      const extras = Object.keys(cfg).filter(k => !KNOWN.has(k)).sort();
      const h = document.createElement('h3');
      h.textContent = 'Otros ajustes';
      box.appendChild(h);
      const extraBox = document.createElement('div');
      extraBox.className = 'extras';
      for (const k of extras) extraBox.appendChild(buildExtraRow(k, cfg[k]));
      box.appendChild(extraBox);

      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Añadir ajuste';
      addBtn.onclick = () => extraBox.appendChild(buildExtraRow('', ''));
      box.appendChild(addBtn);

      const foot = document.createElement('div');
      foot.className = 'settings-foot';
      const save = document.createElement('button');
      save.className = 'primary';
      save.textContent = isActive ? 'Guardar y reiniciar' : 'Guardar';
      save.disabled = busy;
      save.onclick = () => saveSettings(p.name, box, isActive);
      foot.appendChild(save);
      const note = document.createElement('span');
      note.className = 'note';
      note.textContent = isActive
        ? 'Reinicia el servidor para aplicarlo (1-2 min).'
        : 'Se aplica la próxima vez que lo actives.';
      foot.appendChild(note);
      box.appendChild(foot);
      return box;
    }

    function buildField(f, value) {
      const wrap = document.createElement('div');
      const isBool = f.type === 'bool';
      wrap.className = 'field' + (isBool ? ' check' : '') + (f.wide ? ' wide' : '');

      let input;
      if (f.type === 'select') {
        input = document.createElement('select');
        for (const o of ['', ...f.options]) {
          const opt = document.createElement('option');
          opt.value = o;
          opt.textContent = o || '(sin definir)';
          input.appendChild(opt);
        }
        input.value = f.options.includes(String(value).toUpperCase()) ? String(value).toUpperCase()
                    : (f.options.includes(String(value)) ? String(value) : '');
      } else if (isBool) {
        input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = String(value).toLowerCase() === 'true';
      } else if (f.type === 'modpack') {
        // input + datalist: se elige de la lista publicada o se pega una URL
        input = document.createElement('input');
        input.type = 'text';
        input.value = value;
        input.placeholder = 'ninguno — versión y loader mandan';
        const listId = 'packs-' + Math.random().toString(36).slice(2, 9);
        input.setAttribute('list', listId);
        const dl = document.createElement('datalist');
        dl.id = listId;
        for (const name of MODPACKS) {
          const o = document.createElement('option');
          o.value = PACK_BASE + name;
          o.label = name;
          dl.appendChild(o);
        }
        wrap.appendChild(dl);
      } else {
        input = document.createElement('input');
        input.type = f.type === 'number' ? 'number' : 'text';
        input.value = value;
      }
      input.dataset.key = f.k;
      input.dataset.kind = f.type || 'text';

      const label = document.createElement('label');
      label.textContent = f.label;

      if (isBool) { wrap.appendChild(input); wrap.appendChild(label); }
      else {
        wrap.appendChild(label);
        wrap.appendChild(input);
        if (f.hint) {
          const hint = document.createElement('div');
          hint.className = 'hint';
          hint.textContent = f.hint;
          wrap.appendChild(hint);
        }
      }
      return wrap;
    }

    function buildExtraRow(k, v) {
      const row = document.createElement('div');
      row.className = 'extra-row';
      const ki = document.createElement('input');
      ki.type = 'text'; ki.className = 'k'; ki.value = k; ki.placeholder = 'CLAVE';
      const vi = document.createElement('input');
      vi.type = 'text'; vi.value = v; vi.placeholder = 'valor';
      const del = document.createElement('button');
      del.textContent = '✕';
      del.title = 'quitar';
      del.onclick = () => { vi.value = ''; row.remove(); };
      row.appendChild(ki); row.appendChild(vi); row.appendChild(del);
      return row;
    }

    function collectSettings(box) {
      const changes = {};
      box.querySelectorAll('[data-key]').forEach(el => {
        const k = el.dataset.key;
        changes[k] = el.dataset.kind === 'bool'
          ? (el.checked ? 'true' : 'false')
          : el.value.trim();
      });
      box.querySelectorAll('.extra-row').forEach(row => {
        const [ki, vi] = row.querySelectorAll('input');
        const k = ki.value.trim().toUpperCase();
        if (k) changes[k] = vi.value.trim();
      });
      return changes;
    }

    async function saveSettings(profile, box, isActive) {
      const changes = collectSettings(box);
      showMsg('');
      try {
        const r = await api('/api/panel/action', {
          method: 'POST',
          body: JSON.stringify({ op: 'set', profile, changes }),
        });
        const d = await r.json();
        if (!d.ok) { showMsg(d.error || 'no se pudo guardar', 'err'); return; }
        if (isActive) {
          showMsg('Guardado. Reiniciando para aplicarlo…', 'info');
          doAction('use', profile);
        } else {
          showMsg(`Guardado (${d.applied.length} ajustes). Se aplica al activarlo.`, 'info');
          refresh();
        }
      } catch (e) {
        showMsg('Error de red al guardar.', 'err');
      }
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function refresh() {
      try {
        const r = await api('/api/panel/status');
        if (r.status === 401) {
          showMsg('Tu sesión caducó. Recargá la página para volver a entrar.', 'err');
          return;
        }
        const d = await r.json();
        if (!d.ok) { showMsg(d.error || 'no se pudo leer el estado', 'err'); return; }
        render(d);
        schedule();
      } catch (e) {
        showMsg('Sin conexión con el servidor.', 'err');
        schedule();
      }
    }

    function schedule() {
      clearTimeout(timer);
      // Con un formulario abierto no se refresca solo: repintar borraria lo
      // que la persona este escribiendo. Mientras hay un cambio en curso si,
      // porque ahi lo que importa es ver el progreso.
      if (OPEN.size && !busy) return;
      timer = setTimeout(refresh, busy ? 3000 : 15000);
    }

    async function doAction(op, profile) {
      if (op === 'stop' && !confirm('¿Apagar el servidor que esté activo?')) return;
      showMsg('');
      busy = true;
      try {
        const r = await api('/api/panel/action', {
          method: 'POST',
          body: JSON.stringify(profile ? { op, profile } : { op }),
        });
        const d = await r.json();
        if (!d.ok) { showMsg(d.error || 'no se pudo ejecutar', 'err'); busy = false; }
        else showMsg('Operación en curso, esto tarda entre 1 y 2 minutos.', 'info');
      } catch (e) {
        showMsg('Error de red.', 'err');
        busy = false;
      }
      refresh();
    }

    loadModpacks().then(refresh);
  </script>
</body>
</html>
