<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir modpack · ChrisCraft</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0e0f12; color: #e5e7eb;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; padding: 32px 16px;
    }
    .wrap { width: 100%; max-width: 560px; }
    header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 24px; color: #a7f3d0; }
    .sub { color: #9ca3af; margin-top: 6px; font-size: 13px; }

    .auth-card {
      background: #18181b; border: 1px solid #27272a; border-radius: 10px;
      padding: 16px; margin-bottom: 16px;
    }
    .auth-card label {
      display: block; font-size: 12px; color: #9ca3af;
      text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px;
      margin-top: 8px;
    }
    .auth-card label:first-child { margin-top: 0; }
    .auth-card input {
      width: 100%; padding: 9px 12px;
      background: #0f1014; border: 1px solid #27272a; border-radius: 6px;
      color: #e5e7eb; font-size: 14px; font-family: inherit;
    }
    .auth-card input:focus { outline: none; border-color: #10b981; }
    .auth-card .auth-hint {
      font-size: 12px; color: #6b7280; margin-top: 10px;
    }
    .auth-card .auth-status {
      font-size: 12px; color: #6ee7b7; margin-top: 8px; display: none;
    }
    .auth-card.locked .auth-status { display: block; }

    .drop {
      background: #18181b; border: 2px dashed #3f3f46; border-radius: 12px;
      padding: 48px 24px; text-align: center; transition: all 0.15s;
      cursor: pointer; display: block;
    }
    .drop.disabled { opacity: 0.5; cursor: not-allowed; }
    .drop.drag { border-color: #10b981; background: #0f2d24; }
    .drop .icon { font-size: 48px; margin-bottom: 8px; }
    .drop .hint { color: #9ca3af; font-size: 14px; }
    .drop strong { color: #e5e7eb; }
    input[type=file] { display: none; }

    .status { margin-top: 20px; padding: 16px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
    .status.ok { background: #064e3b; color: #d1fae5; }
    .status.err { background: #7f1d1d; color: #fee2e2; }
    .progress {
      height: 6px; background: #27272a; border-radius: 3px;
      margin-top: 10px; overflow: hidden; position: relative;
    }
    .progress > div { height: 100%; background: #10b981; width: 0; transition: width 0.2s; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 11px; color: #9ca3af; margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    .back { display: block; text-align: center; margin-top: 20px; color: #9ca3af; }
    code { background: #27272a; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    a { color: #a7f3d0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>⬆️ Subir modpack</h1>
      <div class="sub">Arrastrá tu archivo <code>.mrpack</code> o hacé click</div>
    </header>

    <div class="auth-card" id="authCard">
      <label for="userInput">Usuario</label>
      <input id="userInput" type="text" autocomplete="username" placeholder="chris">
      <label for="passInput">Contraseña</label>
      <input id="passInput" type="password" autocomplete="current-password" placeholder="••••••••">
      <div class="auth-hint">Las credenciales se guardan en tu navegador hasta que cierres la pestaña.</div>
      <div class="auth-status" id="authStatus">✓ listo para subir</div>
    </div>

    <label class="drop disabled" id="drop">
      <div class="icon">📦</div>
      <div><strong>Elegí un archivo</strong> o soltalo acá</div>
      <div class="hint" style="margin-top:8px;">.mrpack · máximo 200 MB</div>
      <input type="file" id="file" accept=".mrpack,.zip">
    </label>

    <div id="status"></div>

    <a class="back" href="/">← Volver</a>
  </div>

  <script>
    const drop = document.getElementById('drop');
    const input = document.getElementById('file');
    const status = document.getElementById('status');
    const authCard = document.getElementById('authCard');
    const authStatus = document.getElementById('authStatus');
    const userInput = document.getElementById('userInput');
    const passInput = document.getElementById('passInput');

    // Detectar si el browser YA cargó con Basic Auth nativo (popup previo).
    // Si carga OK sin prompt nativo, fetch contra /api/status con creds nativos
    // funciona; en ese caso auto-llenamos el form con valores dummy.
    function checkBrowserAuth() {
      fetch('/api/status', { credentials: 'include' }).then(r => {
        if (r.ok) {
          // El browser ya tiene Basic Auth (popup nativo) → habilitar upload
          // sin pedir creds en el form.
          unlock();
          userInput.value = '__browser_auth__';
          passInput.value = '__browser_auth__';
          userInput.disabled = true;
          passInput.disabled = true;
        }
      }).catch(() => {});
    }

    function getCreds() {
      const stored = sessionStorage.getItem('basic_auth');
      if (!stored) return null;
      try {
        const decoded = atob(stored);
        const i = decoded.indexOf(':');
        if (i < 0) return null;
        const u = decoded.slice(0, i);
        const p = decoded.slice(i + 1);
        if (u === '__browser_auth__') return 'browser'; // sentinel: usar auth nativo
        return { u, p };
      } catch(e) { return null; }
    }

    function setCreds(u, p) {
      sessionStorage.setItem('basic_auth', btoa(u + ':' + p));
    }

    function unlock() {
      drop.classList.remove('disabled');
      authCard.classList.add('locked');
    }
    function lock() {
      drop.classList.add('disabled');
      authCard.classList.remove('locked');
    }

    function updateAuth() {
      const u = userInput.value.trim();
      const p = passInput.value;
      if (u && p) {
        setCreds(u, p);
        unlock();
      } else {
        lock();
      }
    }
    userInput.addEventListener('input', updateAuth);
    passInput.addEventListener('input', updateAuth);

    ['dragenter', 'dragover'].forEach(e =>
      drop.addEventListener(e, ev => { ev.preventDefault(); if (!drop.classList.contains('disabled')) drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(e =>
      drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('drag'); }));

    drop.addEventListener('drop', ev => {
      if (drop.classList.contains('disabled')) return;
      const f = ev.dataTransfer.files[0];
      if (f) upload(f);
    });
    drop.addEventListener('click', ev => {
      if (drop.classList.contains('disabled')) {
        passInput.focus();
      }
    });
    input.addEventListener('change', () => {
      if (drop.classList.contains('disabled')) { input.value = ''; return; }
      if (input.files[0]) upload(input.files[0]);
    });

    let startedAt = 0;
    function upload(file) {
      startedAt = Date.now();
      status.innerHTML = `
        <div class="status"><strong>${escapeHtml(file.name)}</strong> · ${(file.size/1024/1024).toFixed(2)} MB
        <div class="progress"><div id="bar"></div></div>
        <div class="progress-label"><span id="pct">0%</span><span id="rate">—</span></div>
        </div>`;
      const bar = document.getElementById('bar');
      const pct = document.getElementById('pct');
      const rate = document.getElementById('rate');
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');

      const creds = getCreds();
      if (creds && creds !== 'browser') {
        xhr.setRequestHeader('Authorization', 'Basic ' + btoa(creds.u + ':' + creds.p));
      }
      // Si creds === 'browser', NO seteamos Authorization header → el browser
      // re-enviará las creds nativas del popup automáticamente.

      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const p = Math.round(e.loaded/e.total*100);
          bar.style.width = p + '%';
          pct.textContent = p + '%';
          const elapsed = (Date.now() - startedAt) / 1000;
          if (elapsed > 0.3) {
            const mbps = (e.loaded / 1024 / 1024) / elapsed;
            const remaining = e.total - e.loaded;
            const eta = mbps > 0.1 ? Math.round(remaining / 1024 / 1024 / mbps) : null;
            rate.textContent = mbps.toFixed(1) + ' MB/s' + (eta !== null ? ' · ~' + eta + 's' : '');
          }
        }
      };
      xhr.onload = () => {
        try {
          const r = JSON.parse(xhr.responseText);
          if (r.ok) {
            status.innerHTML = `<div class="status ok">
              ✅ Recibido <strong>${escapeHtml(r.filename)}</strong>
              <br>Tamaño: ${(r.size/1024/1024).toFixed(2)} MB
              <br>SHA256: <code>${escapeHtml(r.sha256.slice(0,16))}…</code>
              ${r.format.mc_version ? `<br>MC: <code>${escapeHtml(r.format.mc_version)}</code>` : ''}
              ${r.format.loader ? ` · Loader: <code>${escapeHtml(r.format.loader)}</code>` : ''}
              ${r.format.files_in_zip ? ` · ${r.format.files_in_zip} mods` : ''}
              <br><br>📥 Link público: <a href="${escapeHtml(r.download_url)}">${escapeHtml(r.download_url)}</a>
              <br><br><a href="/">← Volver al inicio</a>
            </div>`;
          } else {
            status.innerHTML = `<div class="status err">❌ ${escapeHtml(r.error || 'error desconocido')}</div>`;
          }
        } catch (e) {
          status.innerHTML = `<div class="status err">❌ respuesta inválida: ${escapeHtml(xhr.responseText.slice(0,200))}</div>`;
        }
      };
      xhr.onerror = () => {
        status.innerHTML = `<div class="status err">❌ error de red</div>`;
      };
      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Inicializar: si ya hay creds en sessionStorage, desbloquear
    if (getCreds()) unlock();
    checkBrowserAuth();
  </script>
</body>
</html>
